[project]
name = "ingest"
revision = "1.0"
extends = ["../../packages/db/secretspec.toml"]

[profiles.default]
OPENROUTER_API_KEY = { description = "OpenRouter API key", required = true }
OPENROUTER_EMBEDDING_MODEL = { description = "OpenRouter embedding model slug the Corpus is built with", required = false, default = "openai/text-embedding-3-small" }

[profiles.local]
OPENROUTER_API_KEY = { ref = { item = "wiki/local/server", field = "OPENROUTER_API_KEY" } }
OPENROUTER_EMBEDDING_MODEL = { default = "openai/text-embedding-3-small", ref = { item = "wiki/local/server", field = "OPENROUTER_EMBEDDING_MODEL" } }

[project]
name = "server"
revision = "1.0"
extends = ["../../packages/db/secretspec.toml", "../../packages/corpus/secretspec.toml"]

[profiles.default]
ADMIN_GROUP = { description = "Admin group", required = true }
ALLOWED_ORIGINS_REGEX = { description = "Allowed CORS origins regex", required = true }
AUTH_CLIENT_ID = { description = "Keycloak client ID", required = true }
AUTH_CLIENT_SECRET = { description = "Keycloak client secret", required = true }
AUTH_ISSUER = { description = "Keycloak issuer URL", required = true }
AUTH_JWKS_URI = { description = "Keycloak JWKS URI", required = true }
BETTER_AUTH_URL = { description = "Better Auth trusted origin URL", required = true }
OPENROUTER_MODEL = { description = "OpenRouter chat model slug", required = false, default = "~deepseek/deepseek-v4-flash-latest" }
SENTRY_DSN = { description = "Sentry DSN", required = false }
SERVER_URL = { description = "Server URL", required = true }
SLACK_BOT_TOKEN = { description = "Slack bot token for posting Answers and reactions", required = false }
SLACK_SIGNING_SECRET = { description = "Slack signing secret for verifying Events API requests", required = false }

[profiles.local]
ADMIN_GROUP = { default = "wiki", ref = { item = "wiki/local/server", field = "ADMIN_GROUP" } }
ALLOWED_ORIGINS_REGEX = { default = "^https?://localhost:3000$", ref = { item = "wiki/local/server", field = "ALLOWED_ORIGINS_REGEX" } }
AUTH_CLIENT_ID = { ref = { item = "wiki/generated/local", field = "AUTH_CLIENT_ID" } }
AUTH_CLIENT_SECRET = { ref = { item = "wiki/generated/local", field = "AUTH_CLIENT_SECRET" } }
AUTH_ISSUER = { default = "https://idp.scottylabs.org/realms/labrador", ref = { item = "wiki/local/server", field = "AUTH_ISSUER" } }
AUTH_JWKS_URI = { default = "https://idp.scottylabs.org/realms/labrador/protocol/openid-connect/certs", ref = { item = "wiki/local/server", field = "AUTH_JWKS_URI" } }
BETTER_AUTH_URL = { default = "http://localhost:3000", ref = { item = "wiki/local/server", field = "BETTER_AUTH_URL" } }
OPENROUTER_MODEL = { default = "~deepseek/deepseek-v4-flash-latest", ref = { item = "wiki/local/server", field = "OPENROUTER_MODEL" } }
SERVER_URL = { default = "http://localhost", ref = { item = "wiki/local/server", field = "SERVER_URL" } }
SLACK_BOT_TOKEN = { ref = { item = "wiki/local/server", field = "SLACK_BOT_TOKEN" } }
SLACK_SIGNING_SECRET = { ref = { item = "wiki/local/server", field = "SLACK_SIGNING_SECRET" } }
